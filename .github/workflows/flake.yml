name: Nix flake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 03:00 UTC — catch nixpkgs drift between bot cycles.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: flake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regression guard: does the committed flake.lock build?
  # Add this job to branch-protection required checks.
  build:
    name: Build (locked)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          # We are not on FlakeHub; skip its opportunistic auth noise and use
          # the GitHub Actions cache only.
          use-flakehub: false

      - name: nix flake check
        # Not --all-systems: nixpkgs unstable has dropped x86_64-darwin, so
        # evaluating it throws. CI runs on x86_64-linux, which is what we gate.
        run: nix --print-build-logs flake check

      - name: nix build .#worker-mcp
        run: nix build .#worker-mcp --print-build-logs

      - name: Smoke test
        run: |
          set -o pipefail
          # Server reads session registry from $HOME/.config/worker-mcp; on a fresh
          # runner it loads 0 sessions and still prints the stdio banner.
          out=$(timeout 15 ./result/bin/worker-mcp </dev/null 2>&1 || true)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "worker-mcp server running on stdio"

  # Drift guard: will nixpkgs-latest break us? Not a required check — red here
  # means upstream moved, fix before merging a lock bump.
  build-latest-nixpkgs:
    name: Build (latest nixpkgs)
    runs-on: ubuntu-24.04
    # Don't gate merges; this is forward-looking signal only.
    continue-on-error: true
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Re-resolve nixpkgs to latest
        run: nix flake update nixpkgs

      - name: nix build .#worker-mcp (latest nixpkgs)
        run: nix build .#worker-mcp --print-build-logs

      - name: Upload updated flake.lock on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock-latest-nixpkgs
          path: flake.lock
          if-no-files-found: error
