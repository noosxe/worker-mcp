name: Update flake.lock

on:
  schedule:
    # Mondays 04:00 UTC — after the drift-guard cron has had a chance to surface issues.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Open PR bumping flake inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Update flake.lock and open PR
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          commit-msg: "chore(flake): update flake.lock"
          pr-title: "chore(flake): update flake.lock"
          pr-body: |
            Automated `nix flake update` run.

            CI on this PR (the *Build (locked)* job) validates that the bumped
            inputs still build. Merge once green; if it's red, the failure
            tells you what needs fixing before the next `nixpkgs` roll.
          pr-labels: |
            dependencies
            nix
          # Bump only what can move; systems is a fixed list repo, skip it.
          inputs: nixpkgs
